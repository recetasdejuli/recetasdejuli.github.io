<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Atlas de Juli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#edf2f1; --surface:#fafcfb; --raised:#ffffff;
  --ink:#14303a; --muted:#587078; --line:#cddadb;
  --accent:#b92d57; --accent-ink:#ffffff; --wish:#b97a0a;
  --scrim:rgba(13,32,39,.45);
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0c1a20; --surface:#11242c; --raised:#172e38;
  --ink:#e4eeee; --muted:#8fa7ae; --line:#25414c;
  --accent:#f0739a; --accent-ink:#2a0a16; --wish:#e7b24a;
  --scrim:rgba(2,8,11,.65); color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.top{display:flex;align-items:center;gap:10px 26px;flex-wrap:wrap;padding:12px var(--gut-r) 12px var(--gut-l);border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-style:italic;font-size:26px;line-height:1;font-weight:400;text-decoration:none}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.top .grow{flex:1}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raised)}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 10px;min-width:0}
textarea.input{resize:vertical;min-height:100px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);max-width:56ch;padding:10px 0}

/* map view */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.mapview{flex:1;min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:16px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 20px}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 14px;justify-content:space-between}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:20px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.cgroup{padding-top:12px}
.chead{display:flex;align-items:baseline;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.chead .cname{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.pitem{width:100%;display:flex;align-items:baseline;gap:9px;text-align:left;border:0;background:transparent;padding:7px 6px;border-radius:6px}
.pitem:hover{background:var(--bg)}
.pitem b{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.pitem small{font-size:11.5px;color:var(--muted);text-align:right}
.bigmap{min-height:0;min-width:0}
.leaflet-container{font-family:var(--f-body);background:var(--bg)}
.map{border:1px solid var(--line);border-radius:12px;overflow:hidden;height:380px;z-index:0}
.map.tall{height:520px}
.mk{width:26px;height:26px;border-radius:50%;background:var(--c,#b92d57);color:#fff;border:2px solid #fff;display:grid;place-items:center;font:500 12px/1 var(--f-mono);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.sm{width:16px;height:16px}
.pop b{display:block;font-size:14px}
.pop .hint{display:block;margin:2px 0 6px}
.pop a,.pop button{display:block;border:0;background:none;padding:2px 0;color:#b92d57;font-weight:600;font-size:13px;text-align:left;text-decoration:underline;cursor:pointer}

/* pages */
.page{flex:1;min-height:0;overflow-y:auto}
.page-in{max-width:1040px;margin:0 auto;padding:28px var(--gut-r) 70px var(--gut-l);display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.trip{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;text-decoration:none;min-width:0}
.trip:hover{border-color:var(--muted)}
.trip .thead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.trip h3{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.trip .yr{font-size:14px;color:var(--accent)}
.trip .cities{font-size:14.5px;overflow-wrap:anywhere}
.trip .meta{font-size:12px;color:var(--muted)}
.cover{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line)}
.cover img,.photos img,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:26px}
.stops{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stopchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;font-size:14px}
.stopchip button{border:0;background:transparent;color:var(--muted);padding:0 5px;font-size:15px;line-height:1}
.daygrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;align-items:start}
.daylist{display:flex;flex-direction:column;gap:14px;min-width:0}
.dayblock{display:flex;flex-direction:column;gap:4px}
.dayhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.dayhead i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pt{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.pt .num{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:500 12px/1 var(--f-mono)}
.pt b{font-weight:600;overflow-wrap:anywhere}
.pt .cat{font-size:12.5px;color:var(--muted)}
.pt .note{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.pt .tools{display:flex;gap:2px}
.pt .tools button{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:5px;font-size:14px}
.pt .tools button:hover{background:var(--line);color:var(--ink)}
.pickbar{background:var(--ink);color:var(--surface);padding:8px 8px 8px 14px;border-radius:10px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pickbar .btn{background:transparent;color:inherit;border-color:currentColor}
.picking .leaflet-container{cursor:crosshair}

.entry{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px}
.stamp{width:72px;height:72px;border:1.5px solid var(--accent);color:var(--accent);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);line-height:1.05;transform:rotate(-7deg);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--accent)}
.stamp b{font-size:21px;font-weight:500}.stamp span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.entry-body{display:flex;flex-direction:column;gap:9px;min-width:0;padding-bottom:20px;border-bottom:1px solid var(--line)}
.entry h3{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.15;overflow-wrap:anywhere}
.entry-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.entry-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.6;max-width:65ch}
.photos{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}
.photos.n1{grid-template-columns:1fr}.photos.n2,.photos.n4{grid-template-columns:repeat(2,1fr)}
.photos button{border:0;padding:0;background:var(--line);border-radius:6px;overflow:hidden;aspect-ratio:1}
.photos.n1 button{aspect-ratio:3/2}
.wishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.wish{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wish.done{opacity:.6}
.wish .whead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wish b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.wish .note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:var(--scrim)}
.dlg form{display:flex;flex-direction:column;max-height:calc(100vh - 26px)}
.dlg header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.dlg .x{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.dlg .body{padding:6px 18px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.dlg footer{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg footer .right{display:flex;gap:8px;margin-left:auto}
.srch{display:flex;gap:8px}
.results{display:flex;flex-direction:column;max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.results:empty{display:none}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 10px}
.results li:last-child button{border-bottom:0}
.results button:hover{background:var(--bg)}
.results b{display:block;font-weight:600}
.results small{color:var(--muted);font-size:12.5px}
.where{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--line)}
.thumb button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:var(--ink);color:var(--surface);line-height:1;font-size:14px}
#lightbox{width:auto;max-width:calc(100vw - 16px);background:transparent;border:0}
#lightbox img{display:block;max-width:100%;max-height:calc(100vh - 80px);border-radius:8px}
#lightbox button{display:block;margin:8px auto 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:14px;font-weight:500;z-index:5000;max-width:calc(100vw - 32px)}

@media (max-width:860px){
  html,body{height:auto}
  .mapview{display:flex;flex-direction:column}
  .bigmap{height:62vh;order:1}
  .side{order:2;border-right:0;border-top:1px solid var(--line)}
  .side-body{overflow:visible}
  .page{overflow:visible}
  .page-head h1{font-size:32px}
  .daygrid{grid-template-columns:1fr}
  .map,.map.tall{height:340px}
  .entry{grid-template-columns:56px minmax(0,1fr);gap:12px}
  .stamp{width:56px;height:56px}.stamp b{font-size:17px}.stamp span{font-size:9px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/mapa">Atlas de Juli<span>.</span></a>
  <nav class="nav" aria-label="Secciones">
    <a href="#/mapa" data-nav="mapa">Mapa</a>
    <a href="#/viajes" data-nav="viajes">Viajes</a>
    <a href="#/quiero" data-nav="quiero">Quiero ir</a>
  </nav>
  <span class="grow"></span>
  <button class="btn small ghost" id="btn-backup" type="button">Copia de seguridad</button>
</header>
<main id="app"></main>
<dialog id="dlg" class="dlg"></dialog>
<dialog id="lightbox" aria-label="Foto"><img id="lightbox-img" alt=""><button class="btn" type="button" id="lightbox-close">Cerrar</button></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k]; if(v==null||v===false)continue;
    if(k==="class")e.className=v; else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(3)){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const CATS=[["hotel","Alojamiento","🛏️"],["comida","Comida","🍽️"],["cafe","Café o bar","☕"],["museo","Museo","🏛️"],["monumento","Monumento o estatua","🗿"],["paseo","Paseo o barrio","🚶"],["naturaleza","Naturaleza o playa","🌿"],["mirador","Mirador","🔭"],["compras","Compras","🛍️"],["show","Espectáculo","🎭"],["transporte","Transporte","🚆"],["otro","Otro","📍"]];
const WCATS=[["ciudad","Ciudad o pueblo","🏙️"],["idea","Idea","💡"],...CATS.filter(c=>c[0]!=="transporte")];
const catOf=(id,list)=>(list||CATS).find(c=>c[0]===id)||CATS[CATS.length-1];
const DAYC=["#b92d57","#1f7a8c","#c27a0e","#5b4bb5","#2e8b57","#d1495b","#3a6ea5","#8a5a44"];
const dayColor=d=>DAYC[(d-1)%DAYC.length];
let regionNames=null; try{regionNames=new Intl.DisplayNames(["es"],{type:"region"});}catch(e){}
const countryName=(cc,fb)=>{ if(!cc)return fb||"Sin país"; try{return (regionNames&&regionNames.of(cc))||fb||cc;}catch(e){return fb||cc;} };
const flag=cc=>/^[A-Z]{2}$/.test(cc||"")?String.fromCodePoint(...[...cc].map(c=>127397+c.charCodeAt(0))):"";
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?{y:+m[1],m:+m[2],d:+m[3]}:null;};
const fmtDate=s=>{const p=pd(s); return p?`${p.d} ${MES[p.m-1]} ${p.y}`:"";};
function fmtRange(a,b){
  const x=pd(a),y=pd(b); if(!x)return ""; if(!y||a===b)return fmtDate(a);
  if(x.y===y.y&&x.m===y.m)return `${x.d}–${y.d} ${MES[x.m-1]} ${x.y}`;
  if(x.y===y.y)return `${x.d} ${MES[x.m-1]} – ${y.d} ${MES[y.m-1]} ${x.y}`;
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
let toastT=0;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},4200);}
const dark=()=>window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;

/* ================= storage (this browser) ================= */
const idb=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("atlas-juli",1);
    r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("photos");};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});};
  return {get:(s,k)=>tx(s,"readonly",o=>o.get(k)),put:(s,k,v)=>tx(s,"readwrite",o=>o.put(v,k)),del:(s,k)=>tx(s,"readwrite",o=>o.delete(k)),keys:s=>tx(s,"readonly",o=>o.getAllKeys())};
})();
let DB={trips:[],points:[],entries:[],wishes:[]};
async function loadDB(){ try{const d=await idb.get("kv","state"); if(d)DB=Object.assign({trips:[],points:[],entries:[],wishes:[]},d);}catch(e){toast("Este navegador no deja guardar datos. Probá sin modo incógnito.");} }
let saveT=0;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{idb.put("kv","state",DB).catch(()=>toast("No se pudo guardar el último cambio."));},150); }
const photoURLs=new Map();
async function shrink(file){
  try{const bmp=await createImageBitmap(file),s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.86)); if(blob)return blob;}catch(e){}
  return file;
}
async function addPhoto(file){const blob=await shrink(file),id=uid();await idb.put("photos",id,blob);photoURLs.set(id,URL.createObjectURL(blob));return id;}
async function photoURL(id){ if(photoURLs.has(id))return photoURLs.get(id); const b=await idb.get("photos",id); if(!b)return ""; const u=URL.createObjectURL(b);photoURLs.set(id,u);return u; }
function dropPhotos(ids){(ids||[]).forEach(id=>{idb.del("photos",id).catch(()=>{});photoURLs.delete(id);});}

/* ================= backup ================= */
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});
async function exportAll(){
  const photos={};for(const k of await idb.keys("photos")){const b=await idb.get("photos",k);if(b)photos[k]=await blobToData(b);}
  const blob=new Blob([JSON.stringify({app:"atlas-juli",v:1,saved:new Date().toISOString(),db:DB,photos})],{type:"application/json"});
  const a=h("a",{href:URL.createObjectURL(blob),download:`atlas-de-juli-${todayStr()}.json`});document.body.append(a);a.click();a.remove();toast("Copia descargada");
}
async function importAll(file){
  try{const j=JSON.parse(await file.text()); if(j.app!=="atlas-juli"||!j.db)throw 0;
    DB=Object.assign({trips:[],points:[],entries:[],wishes:[]},j.db);await idb.put("kv","state",DB);
    for(const k in (j.photos||{})){const b=await (await fetch(j.photos[k])).blob();await idb.put("photos",k,b);}
    photoURLs.clear();location.hash="#/viajes";render();toast("Copia restaurada");
  }catch(e){toast("Ese archivo no es una copia del atlas.");}
}
$("#btn-backup").onclick=()=>openDialog("Copia de seguridad",[
  h("p",{text:"Tus viajes y fotos se guardan en este navegador. Descargá una copia cada tanto: sirve para no perder nada y para pasar todo a otro dispositivo."}),
  h("button",{class:"btn primary",type:"button",style:"align-self:flex-start",onclick:()=>{dlg.close();exportAll();}},"Descargar copia"),
  h("p",{class:"hint",text:"Restaurar reemplaza todo lo que hay en este navegador por el contenido del archivo."}),
  confirmBtn("Restaurar desde un archivo","¿Reemplazar todo?",()=>{dlg.close();$("#import-file").click();},"btn")],{});
$("#import-file").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importAll(f);});

loadDB().then(()=>{ if(!location.hash)location.replace("#/mapa"); render(); });
})();
